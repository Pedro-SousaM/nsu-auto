name: Consulta NSU SEFAZ

on:
  schedule:
    - cron: '0 * * * *'  # Roda todo início de hora
  workflow_dispatch:      # Permite rodar manualmente também

permissions:
  contents: write  

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Instalar axios
        run: npm install axios
      
      # Pega o NSU atual do arquivo (se não existir, usa o início)
      - name: Definir NSU atual
        id: nsu
        run: |
          if [ -f nsu-atual.txt ]; then
            echo "atual=$(cat nsu-atual.txt)" >> $GITHUB_OUTPUT
          else
            echo "atual=7700" >> $GITHUB_OUTPUT
          fi
      
      - name: Executar consultas
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          CPF_CNPJ: ${{ secrets.CPF_CNPJ }}
          NSU_ATUAL: ${{ steps.nsu.outputs.atual }}
          NSU_FIM: "8261"
          UF: "MA"
          AMBIENTE: "producao"
        run: node consulta-nsu.js
      
      - name: Commit do progresso
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add nsu-atual.txt
          git diff --staged --quiet || git commit -m "Atualiza NSU: $(cat nsu-atual.txt)"
          git push
